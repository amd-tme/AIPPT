name: Factory app gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
          cache: npm
      - name: Install declared dependencies and warm the npm cache
        run: |
          python -m pip install -r requirements.txt -r docs/requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
      # Keep these commands aligned with [[gate.check]] in .factory.toml.
      - name: Check stable Node permissions
        run: node --permission --eval 'if (!process.permission) process.exit(1)'
      - name: Install locked Node dependencies offline
        run: npm ci --offline --ignore-scripts --no-audit --no-fund --logs-max=0
      - name: Run the fast suite
        run: python -m pytest tests/ -q
      - name: Build documentation
        run: python -m sphinx -M html docs docs/_build -W
