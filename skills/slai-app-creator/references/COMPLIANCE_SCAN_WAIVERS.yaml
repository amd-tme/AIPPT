    output guarantee.
- asset: skills/slai-app-creator
  file: scripts/prepare_platform_checkout.py
  check_id: SYM-001
  span_hash: sha256:528b4ebdca88d6bd360364cf2cbdb69209bc482ff25ae0e20fc368e6813c3208
  status: active
  source: manual
  llm_verdict: null
  llm_reason: 'User explicitly waived on 2026-10-17: ancestors of HOME are IT-owned
    managed infrastructure. Retain validated user HOME as the supported ancestry trust
    boundary; arbitrary ownership above HOME is not an application-controlled path.'
  approver: ctung
  approved_date: '2026-10-17T05:44:25Z'
  expiry: null
  file_hash: sha256:c2384e969cbce13c5f73c56fb90cc230c3ca028cb784696188839d93494457c6
  line_start: 26
  line_end: 26
  original_description: The HOME boundary traversal permits ancestors owned by unrelated
    users when their current mode lacks group/world write bits. Such an owner can
    still replace descendant path components. Subsequent ancestry validation starts
    at HOME, omitting those ancestors, and closes the traversal descriptor before
    pathname-based Git metadata checks. A checkout under such a HOME can therefore
    pass validation despite an ancestor owner retaining path-replacement authority.
