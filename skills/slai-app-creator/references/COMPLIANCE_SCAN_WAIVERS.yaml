  original_description: Validation closes the ancestry descriptor and subsequently
    uses pathname-based temporary creation, replacement, and cleanup. Revalidating
    immediately before replacement does not make these operations atomic with validation.
    If a component is replaceable, including through the unchecked ancestor-owner
    case, a redirect between checks and use can move output or cleanup into a different
    directory.
