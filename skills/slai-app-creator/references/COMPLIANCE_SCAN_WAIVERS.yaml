  check_id: SYM-001
  span_hash: sha256:af4c1ad64efccfc40d95be042cf85741addd2c8da37f88368921f4c693a9eb50
  status: active
  source: manual
  llm_verdict: null
  llm_reason: 'User explicitly waived this same SOPS HOME boundary finding: there
    are no owners above HOME in the managed NFS environment.'
  approver: ctung
  approved_date: '2026-10-16T03:20:30Z'
  expiry: null
  file_hash: sha256:b47c1342a230dcebccd48764e21f5ab449eaae934c0c5913d6f2bd06048c5a7b
  line_start: 30
  line_end: 31
  original_description: The HOME traversal checks ancestor write permissions but not
    ancestor ownership. A foreign-owned directory with mode 0755 passes, although
    its owner can rename or replace its children. After checksum verification, this
    helper returns a pathname that the encryption script executes separately. An ancestor
    owner can replace the HOME directory with a redirected tree between verification
    and execution, causing an unverified executable to receive plaintext secrets.
    Private permissions on HOME and the cache do not prevent replacement by their
    parent-directory owner.
- asset: skills/slai-app-creator
  file: scripts/private-sops-cache.py
  check_id: SYM-001
  span_hash: sha256:528b4ebdca88d6bd360364cf2cbdb69209bc482ff25ae0e20fc368e6813c3208
  status: active
  source: manual
  llm_verdict: null
  llm_reason: 'User explicitly waived this SOPS HOME ancestry finding on unchanged
    source: there are no owners above HOME in the managed NFS environment.'
  approver: ctung
  approved_date: '2026-10-16T03:21:39Z'
  expiry: null
  file_hash: sha256:b47c1342a230dcebccd48764e21f5ab449eaae934c0c5913d6f2bd06048c5a7b
  line_start: 30
  line_end: 30
  original_description: HOME ancestors are checked for writable permission bits but
    not trusted ownership. A foreign owner of a mode-0755 ancestor can rename its
    children or change its permissions, replacing the user's HOME path. The ancestry
    descriptor is subsequently closed, and cache validation, binary verification,
    and eventual execution use pathname lookups. An ancestor owner can therefore replace
    the directory chain after validation or checksum verification and redirect execution
    to an unverified SOPS binary. The same ownership-check pattern appears in other
    supplied ancestry helpers.
