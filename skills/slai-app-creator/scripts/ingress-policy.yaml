# Platform-owned dedicated-certificate prototype; ordinary route checks still apply.
dedicated_tls_secrets:
  ssl-test: ssl-test-tls

# Exact routes that predate the subdomain-only policy. Entries are intentionally
# strict: changing a host, path, file, or Secret requires platform-infra review.
# One-time certificate transitions preserve every frozen legacy URL. This does
# not authorize new deployments under apex paths or additional legacy hosts.
legacy_host_tls_secrets:
  slai-app.amd.com: platform-apex-tls
  dcgpu-hub.amd.com: platform-dcgpu-hub-tls

grandfathered_routes:
  # Platform broker exposes only its public realm and static-resource surfaces.
  # A root route would also expose Keycloak administration and is forbidden.
  - {app_id: platform-sso-keycloak, file: z-ingress.yaml, host: sso.slai-app.amd.com, path: /realms/slai-app, secret_name: slai-app-wildcard-tls, path_type: Prefix}
  - {app_id: platform-sso-keycloak, file: z-ingress.yaml, host: sso.slai-app.amd.com, path: /resources, secret_name: slai-app-wildcard-tls, path_type: Prefix}
  - {app_id: aippt, file: z-ingress.yaml, host: slai-app.amd.com, path: '/aippt(/|$)(.*)', secret_name: slai-app-amd-com-tls, path_type: ImplementationSpecific}
  - {app_id: atlassian-cli-proxy, file: z-ingress.yaml, host: atlassian-cli-proxy.slai-app.amd.com, path: /, secret_name: hosted-slai-atlassian-cli-proxy-tls, path_type: Prefix}
  # Applications own authentication and public endpoint routing.
  - {app_id: bdcloc, file: z-ingress.yaml, host: bdcloc.slai-app.amd.com, path: /, secret_name: hosted-slai-bdcloc-tls, path_type: Prefix}
