apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aippt
  namespace: slai-app-prod
  labels:
    app.kubernetes.io/name: aippt
    app.kubernetes.io/instance: hosted-slai-aippt
    app.kubernetes.io/managed-by: slai-app-platform
    hosted-by: slai-app-platform
    customer-team: tme-dcgpu
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aippt
      app.kubernetes.io/instance: hosted-slai-aippt
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the RKE2 ingress controller may reach the pod (platform template
    # selectors). Port is the container listener, not the Service port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/instance: rke2-ingress-nginx
              app.kubernetes.io/name: rke2-ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  # Kubernetes NetworkPolicy has no FQDN destinations, so each dependency is
  # pinned to the addresses it resolved to on the AMD network on 2026-10-22.
  # If a host is renumbered, that dependency fails closed: re-resolve from the
  # cluster network and update the addresses here.
  egress:
    # Cluster DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # OTLP gRPC -> platform collector atlvslaiapp03.amd.com:4317
    - to:
        - ipBlock:
            cidr: 10.180.94.126/32
      ports:
        - protocol: TCP
          port: 4317
    # AMD LLM Gateway llm-api.amd.com (CNAME llm-api.ecs-dtc.amd.com).
    # 10.214.150.4 is its address inside the AMD network, as other platform
    # apps also pin; laptops on VPN may resolve it to 100.64.x.x instead.
    - to:
        - ipBlock:
            cidr: 10.214.150.4/32
      ports:
        - protocol: TCP
          port: 443
    # MinIO S3 API s3minio.amd.com:21000 (CNAME s3ozn.wip.amd.com, a
    # load-balanced name) for object-storage persistence (uploads, images,
    # output and the SQLite catalog snapshot under asic/aippt/).
    - to:
        - ipBlock:
            cidr: 10.180.196.19/32
        - ipBlock:
            cidr: 10.180.196.20/32
        - ipBlock:
            cidr: 10.180.196.21/32
        - ipBlock:
            cidr: 10.180.196.22/32
        - ipBlock:
            cidr: 10.180.196.23/32
        - ipBlock:
            cidr: 10.180.196.24/32
      ports:
        - protocol: TCP
          port: 21000
    # Microsoft Graph and Entra ID are served from Microsoft ranges whose DNS
    # answers rotate every few minutes, and the validator accepts only
    # single-address destinations. These are every IPv4 address seen in about
    # 25 minutes of lookups on 2026-10-22; the hosts will resolve outside this
    # list, so SharePoint render and device-code sign-in can fail
    # intermittently. Accepted knowingly until the platform offers an egress
    # proxy or a reviewed exception.
    # graph.microsoft.com (24 addresses): SharePoint PPTX render
    - to:
        - ipBlock:
            cidr: 20.190.151.33/32
        - ipBlock:
            cidr: 20.190.151.37/32
        - ipBlock:
            cidr: 20.190.151.38/32
        - ipBlock:
            cidr: 20.190.151.91/32
        - ipBlock:
            cidr: 20.190.151.101/32
        - ipBlock:
